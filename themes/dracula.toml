# Dracula theme for yatmux
# Copy to: ~/.config/yatmux/themes/dracula.toml

[colors]
background = "#282A36"
foreground = "#F8F8F2"
accent = "#BD93F9"

# Optional 16-color ANSI palette (0-15)
palette = [
  "#21222C", "#FF5555", "#50FA7B", "#F1FA8C",
  "#BD93F9", "#FF79C6", "#8BE9FD", "#F8F8F2",
  "#6272A4", "#FF6E6E", "#69FF94", "#FFFFA5",
  "#D6ACFF", "#FF92DF", "#A4FFFF", "#FFFFFF",
]

# UI overrides are optional; yatmux derives UI colors from [colors] by default.
# [ui.search]
# match_bg = "#3B2E5A"
# current_match_bg = "#4D3B7A"
